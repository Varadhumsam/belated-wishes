<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock the Surprise 💝</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="eyebrow">The little task</div>
    <div class="big-emoji">🎁</div>
    <img src="./image3.jpeg" alt="Our photo" style="width:100%; max-width:300px; height:auto;">
    <h1>Unlock your gift</h1>
    <p>Choose the answer you think is right!</p>
    <div class="question">What makes this surprise special?</div>
    <div class="choices">
      <button class="choice" data-answer="no">The gift 🎀</button>
      <button class="choice" data-answer="yes">You 💗</button>
      <button class="choice" data-answer="no">The cake 🍰</button>
    </div>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <a id="next" class="btn hidden" href="letter.html">You unlocked it! →</a>
    <a class="text-link" href="index.html">← Go back</a>
  </main>
  <script src="script.js"></script>
</body>
</html>
